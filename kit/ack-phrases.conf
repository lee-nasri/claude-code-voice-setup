# One spoken acknowledgement per line, plain text. Edit freely, then run:
#   ~/.claude/tts/regen-ack.sh
# to re-render them in every team voice (a few seconds, all local).
#
# Length is free — these are pre-rendered files, so playback starts instantly
# whatever the length, and the real reply is 10-20s behind it anyway.
# Blank lines and #comments ignored. Keep them team-neutral: any team may speak
# any of these, and they play BEFORE the model has read the prompt, so they can
# never refer to what you asked for.
Let me check that for you. Give me a moment.
Okay, I am on it. One moment.
Right, let me look into that.
Give me a second, I am reading it now.
Sure, let me take a look.
On it now, back with you shortly.
